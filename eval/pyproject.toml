[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "erc-eval"
version = "0.1.0"
description = "Extraction-accuracy evaluation for E-Rechnung-Check: scores model output against the XML embedded in ZUGFeRD PDFs."
readme = "README.md"
license = "MIT"
authors = [{ name = "Syed Aayan Ahmed" }]
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.9,<3",
  "pypdf>=5,<7",
  "defusedxml>=0.7",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "jsonschema>=4.23"]

[project.scripts]
erc-eval = "erc_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "PT"]
ignore = ["PLR0913", "PLR2004", "PLR0911", "PLR0912", "PLR0915"]
allowed-confusables = ["–"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLC0415"]
