name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Lockfile has the Linux entries CI needs
        run: node --no-warnings scripts/ci/check-lockfile.ts
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Shared schema and prompt are up to date
        run: node --no-warnings scripts/schema/export-schema.ts --check
      - name: Fetch pinned KoSIT artefacts (SHA-256 verified) and compile the rules
        run: npm run rules
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: Browser tests (Playwright, axe)
    runs-on: ubuntu-latest
    needs: web
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run rules
      - run: npm run build
      - run: npx playwright test
        env:
          PW_CHANNEL: chromium

  python:
    name: Eval (ruff, pytest, recorded run)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: eval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: eval/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - name: Eval on recorded outputs (network blocked) matches the committed results
        run: |
          python -m erc_eval run --corpus synthetic --out /tmp/eval
          diff -u results/latest.md /tmp/eval/latest.md

  parity:
    name: Parity with the official KoSIT Java validator
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm run rules
      - name: Fetch the ZUGFeRD community corpus (Apache-2.0, pinned commit)
        run: npm run corpus:external
        env:
          ZUGFERD_CORPUS_REF: 02d4b5684738cb2d9faac2cec6599dc0e86c16d5
      - name: Java vs JS on test suite, mutations, synthetic and external corpus (fails on any difference)
        run: npm run parity
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-report
          path: .cache/parity/parity-report.json
